# R CMD check with the full test suite and the \donttest examples, on the
# current, previous and development versions of R (rOpenSci asks for all
# three): on Linux for every push to main and every pull request into it (not
# for changes confined to the site, dev/ or pkgdown/), and by hand from the
# Actions tab or with `gh workflow run R-CMD-check.yaml -f os=<runner>`,
# which also offers macOS.
# The tests need MAFFT and HMMER from the tantale conda environment, which
# tantale_setup() builds here exactly as a user would: micromamba first,
# then tantale_setup(install = TRUE), which also installs the Java tools
# and example genomes from the release archives.
# Runners: Linux, and an Intel Mac (the pinned bioconda tools have osx-64
# builds, none for osx-arm64 or Windows; DESCRIPTION has OS_type: unix).
# macos-15-intel is GitHub's last Intel image, supported until autumn 2027.
name: R-CMD-check

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'dev/**', 'pkgdown/**', '.claude/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'dev/**', 'pkgdown/**', '.claude/**']
  workflow_dispatch:
    inputs:
      os:
        description: Runner
        type: choice
        options:
          - ubuntu-latest
          - macos-15-intel
        default: ubuntu-latest

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # inputs.os is empty on push and pull_request events
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    name: ${{ inputs.os || 'ubuntu-latest' }} (R ${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: [release, oldrel-1, devel]
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, local::.
          needs: check

      - uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: none

      - name: Point reticulate at micromamba
        run: echo "RETICULATE_CONDA=$(command -v micromamba)" >> "$GITHUB_ENV"

      # The Java tools and example genomes are release assets of this
      # repository (ledger §50). Fetched with gh, which authenticates, so
      # this works while the repository is private too.
      - name: Download the tools and genomes archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tools-1 -D "$RUNNER_TEMP/archives"
          gh release download genomes-1 -D "$RUNNER_TEMP/archives"

      - name: Build the tantale environment, install the archives
        run: Rscript -e 'tantale::tantale_setup(install = TRUE, archive_dir = file.path(Sys.getenv("RUNNER_TEMP"), "archives"))'

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--run-donttest")'
          error-on: '"error"'
          upload-snapshots: true
