# Test coverage, reported to Codecov (rOpenSci requires CI linked to a
# coverage service). Same triggers as R-CMD-check.yaml, and the same setup:
# the tests need the tantale conda environment and the release archives.
# Codecov reads the upload token from the repository secret CODECOV_TOKEN.
name: test-coverage

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'dev/**', 'pkgdown/**', '.claude/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'dev/**', 'pkgdown/**', '.claude/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, local::.
          needs: coverage

      - uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: none

      - name: Point reticulate at micromamba
        run: echo "RETICULATE_CONDA=$(command -v micromamba)" >> "$GITHUB_ENV"

      - name: Download the tools and genomes archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tools-1 -D "$RUNNER_TEMP/archives"
          gh release download genomes-1 -D "$RUNNER_TEMP/archives"

      - name: Build the tantale environment, install the archives
        run: Rscript -e 'tantale::tantale_setup(install = TRUE, archive_dir = file.path(Sys.getenv("RUNNER_TEMP"), "archives"))'

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # a failed upload fails the run on main, not on a pull request
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
